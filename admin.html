<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script>if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; } window.scrollTo(0, 0);</script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Admin — Zavier's 7th Birthday RSVPs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Same design tokens, type, buttons, chips, modal styling as the main site -->
  <link rel="stylesheet" href="style.css?v=21">

  <style>
    /* ===== ADMIN-ONLY LAYOUT (built on the shared tokens from style.css;
       no 3D "7" canvas here — just the aurora glow + grain ambience) ===== */
    body { cursor: auto; }
    a, button { cursor: pointer; }
    .admin-page { position: relative; z-index: 2; max-width: 1220px; margin: 0 auto; padding: clamp(28px, 5vh, 56px) clamp(18px, 4vw, 40px) 90px; }

    .admin-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 20px; flex-wrap: wrap; margin-bottom: clamp(28px, 5vh, 48px);
    }
    .admin-title { font-size: clamp(32px, 5vw, 54px); letter-spacing: -0.02em; color: var(--cream); }
    .admin-title em {
      font-style: italic; font-weight: 500;
      background: linear-gradient(120deg, var(--magenta-2), var(--gold-2));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .admin-sub { margin-top: 10px; font-size: 14px; color: var(--cream-dim); font-weight: 500; }

    .auth-chip {
      display: inline-flex; align-items: center; gap: 10px;
      border: 1px solid var(--line-lit); border-radius: var(--r-pill);
      padding: 10px 18px; background: var(--glass); backdrop-filter: blur(14px);
      font-size: 13px; font-weight: 600; color: var(--cream-dim);
    }
    .auth-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 10px var(--teal); }
    .auth-chip strong { color: var(--gold-2); }
    .signin-inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .signin-inline .input { height: 44px; font-size: 13.5px; width: 168px; padding: 0 16px; }

    /* Stat tiles — same frosted-glass tint language as the Special Thanks cards */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(14px, 2vw, 20px); margin-bottom: clamp(22px, 4vh, 34px); }
    .stat-tile {
      --tint: 255, 197, 61;
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 16px;
      padding: 22px 24px; border-radius: var(--r-lg);
      border: 1px solid var(--line-lit);
      background: linear-gradient(155deg, rgba(var(--tint), 0.14), rgba(16,11,36,0.5) 60%);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      transition: transform 0.4s var(--ease-spring), border-color 0.3s;
    }
    .stat-tile:hover { transform: translateY(-3px); border-color: rgba(var(--tint), 0.55); }
    .stat-tile.total    { --tint: 255, 61, 138; }
    .stat-tile.going    { --tint: 35, 229, 176; }
    .stat-tile.regrets  { --tint: 255, 197, 61; }
    .stat-icon { font-size: 30px; line-height: 1; flex-shrink: 0; filter: drop-shadow(0 8px 18px rgba(var(--tint), 0.35)); }
    .stat-label { font-size: 11px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
    .stat-value { font-family: var(--font-display); font-size: clamp(30px, 4vw, 42px); font-weight: 600; color: var(--cream); line-height: 1.1; }

    /* Controls: filter chips + search + action buttons */
    .controls-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .controls-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-chip {
      border: 1px solid var(--line-lit); border-radius: var(--r-pill);
      padding: 9px 18px; font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em;
      color: var(--cream-dim); background: transparent; transition: all 0.3s;
    }
    .filter-chip:hover { border-color: var(--gold); color: var(--gold-2); }
    .filter-chip.is-active { background: linear-gradient(130deg, var(--magenta), #C21458); border-color: transparent; color: #fff; }
    /* Standalone inputs outside a .field-float wrapper (search box, inline
       sign-in) need centered text — the base .input padding assumes a
       floating label reserving space above it */
    .input.no-float { padding: 0 16px; }
    .input.no-float::placeholder { color: var(--muted); }
    .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 320px; }
    .search-wrap .input { height: 46px; padding: 0 16px 0 40px; font-size: 13.5px; }
    .search-wrap .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: 0.5; pointer-events: none; }
    .controls-divider { width: 1px; height: 30px; background: var(--line); }
    .controls-info { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 600; }
    .controls-info strong { color: var(--gold-2); }
    .btn--table { height: 44px; padding: 0 20px; font-size: 12px; }
    .btn--danger {
      color: var(--magenta-2); background: rgba(255,61,138,0.1); border: 1.5px solid rgba(255,61,138,0.35);
      height: 44px; padding: 0 20px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s;
    }
    .btn--danger:hover { background: rgba(255,61,138,0.22); border-color: var(--magenta); }
    .disabled { opacity: 0.4; pointer-events: none; }

    /* Table card */
    .table-card {
      border: 1px solid var(--line-lit); border-radius: var(--r-lg); overflow: hidden;
      background: linear-gradient(155deg, rgba(139,92,246,0.08), rgba(16,11,36,0.55) 60%);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
      box-shadow: 0 30px 90px rgba(0,0,0,0.4);
    }
    .table-card::before { content: ''; display: block; height: 3px; background: linear-gradient(90deg, var(--magenta), var(--gold-2)); }
    .table-header-bar { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 10px; }
    .table-title { font-family: var(--font-display); font-size: 19px; color: var(--cream); display: flex; align-items: center; gap: 10px; }
    .table-overflow { overflow-x: auto; }

    #rsvpTable { width: 100%; border-collapse: collapse; }
    #rsvpTable thead tr { background: rgba(242,237,228,0.03); border-bottom: 1px solid var(--line); }
    #rsvpTable th {
      padding: 13px 16px; text-align: left; font-family: var(--font-sans);
      font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--gold-2); white-space: nowrap;
    }
    #rsvpTable td { padding: 15px 16px; font-size: 13.5px; color: var(--cream-dim); border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.5; }
    #rsvpTable tbody tr { transition: background 0.25s; }
    #rsvpTable tbody tr:hover { background: rgba(242,237,228,0.03); }
    #rsvpTable tbody tr:last-child td { border-bottom: none; }
    .row-num { font-family: var(--font-display); font-style: italic; font-size: 13px; color: var(--magenta-2); }
    .cell-name { font-weight: 700; color: var(--cream); }
    .cell-headcount { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--gold-2); text-align: center; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 13px; border-radius: var(--r-pill);
      font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap;
    }
    .badge.going   { background: rgba(35,229,176,0.14); color: var(--teal-2); border: 1px solid rgba(35,229,176,0.35); }
    .badge.regrets { background: rgba(255,61,138,0.14); color: var(--magenta-2); border: 1px solid rgba(255,61,138,0.35); }

    .delete-btn {
      background: rgba(255,61,138,0.08); color: var(--magenta-2); border: 1px solid rgba(255,61,138,0.3);
      border-radius: var(--r-sm); padding: 7px 14px; font-size: 11.5px; font-weight: 700;
      letter-spacing: 0.04em; transition: all 0.25s; white-space: nowrap;
    }
    .delete-btn:hover { background: rgba(255,61,138,0.2); border-color: var(--magenta); }

    .state-empty, .state-loading { text-align: center; padding: 70px 24px; color: var(--muted); font-size: 15px; font-weight: 600; }
    .state-empty .state-icon, .state-loading .state-icon { font-size: 44px; display: block; margin-bottom: 14px; }
    .state-loading .state-icon { animation: adminSpin 1.2s linear infinite; display: inline-block; }
    @keyframes adminSpin { to { transform: rotate(360deg); } }

    .admin-footer { margin-top: 44px; text-align: center; color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; }

    @media (max-width: 760px) {
      .stats-grid { grid-template-columns: 1fr; }
      .controls-info { margin-left: 0; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- ===== BACKGROUND SCENE (aurora + grain only — no 3D canvas here) ===== -->
  <div class="bg-scene" aria-hidden="true">
    <div class="aurora-blob aurora-1"></div>
    <div class="aurora-blob aurora-2"></div>
    <div class="aurora-blob aurora-3"></div>
    <div class="bg-vignette"></div>
  </div>
  <div class="film-grain" aria-hidden="true"></div>

  <div class="admin-page">

    <!-- ===== HEADER ===== -->
    <header class="admin-header">
      <div>
        <div class="eyebrow"><span class="idx">⚙</span> Admin Panel · Zavier's 7th</div>
        <h1 class="admin-title">RSVP <em>Dashboard</em></h1>
        <p class="admin-sub">Manage all party RSVPs and responses</p>
      </div>
      <div id="authArea"></div>
    </header>

    <!-- ===== STATS ===== -->
    <div class="stats-grid">
      <div class="stat-tile total">
        <span class="stat-icon">🎉</span>
        <div><div class="stat-label">Total RSVPs</div><div class="stat-value" id="statTotal">—</div></div>
      </div>
      <div class="stat-tile going">
        <span class="stat-icon">✅</span>
        <div><div class="stat-label">Going</div><div class="stat-value" id="statGoing">—</div></div>
      </div>
      <div class="stat-tile regrets">
        <span class="stat-icon">😢</span>
        <div><div class="stat-label">Regrets</div><div class="stat-value" id="statRegrets">—</div></div>
      </div>
    </div>

    <!-- ===== CONTROLS ===== -->
    <div class="controls-bar">
      <div class="controls-group" id="filterGroup">
        <button type="button" class="filter-chip is-active" data-filter="all">All</button>
        <button type="button" class="filter-chip" data-filter="going">✅ Going</button>
        <button type="button" class="filter-chip" data-filter="regrets">😢 Not Going</button>
      </div>

      <div class="search-wrap">
        <span class="search-icon">🔎</span>
        <input type="text" id="searchInput" class="input no-float" placeholder="Search by name…" autocomplete="off">
      </div>

      <div class="controls-divider"></div>

      <button id="refresh" class="btn btn--ghost btn--table">🔄 Refresh</button>
      <button id="exportPdf" class="btn btn--ghost btn--table">📄 PDF</button>
      <button id="exportExcel" class="btn btn--ghost btn--table">📥 Excel</button>
      <button id="clearAll" class="btn--danger">🗑 Clear All</button>
      <button id="backToSite" class="btn btn--ghost btn--table">← Back to Site</button>

      <div class="controls-info">Storage: <strong>Firestore &rsaquo; submissions</strong></div>
    </div>

    <!-- ===== TABLE ===== -->
    <div class="table-card">
      <div class="table-header-bar">
        <div class="table-title">🎟 Guest Submissions</div>
      </div>
      <div class="table-overflow">
        <div id="tableWrap">
          <div class="state-loading"><span class="state-icon">🔐</span>Sign in to view submissions.</div>
        </div>
      </div>
    </div>

    <footer class="admin-footer">Zavier's 7th Birthday · Admin Panel · October 2026</footer>

  </div>

  <!-- ===== LOGIN MODAL (same markup/classes as the main site's login modal) ===== -->
  <div class="modal-backdrop is-center" id="loginModal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal" role="document" aria-labelledby="loginTitle">
      <div class="modal-header">
        <div class="modal-icon">🔐</div>
        <div>
          <h2 id="loginTitle">Admin Login</h2>
          <div class="modal-sub">Sign in to manage RSVPs</div>
        </div>
      </div>

      <div class="field-float">
        <input id="adminEmailModal" class="input" type="text" placeholder=" " autocomplete="email">
        <label for="adminEmailModal">Email</label>
      </div>

      <div class="password-wrapper">
        <div class="field-float">
          <input id="adminPassModal" class="input" type="password" placeholder=" " autocomplete="current-password">
          <label for="adminPassModal">Password</label>
        </div>
        <button type="button" class="toggle-pass-btn" id="toggleLoginPass" aria-label="Show password">👁</button>
      </div>

      <div id="loginError" class="field-error" style="display:none;margin-bottom:14px;"></div>

      <div class="form-actions">
        <button id="loginSubmit" class="btn btn--primary">🔓 Sign In</button>
        <button id="loginCancel" class="btn btn--ghost">Cancel</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";
    import {
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAE50RlfOryMl7-VooU1c7Q2EF2t13_GcE",
      authDomain: "zaviinvitation.firebaseapp.com",
      projectId: "zaviinvitation",
      storageBucket: "zaviinvitation.firebasestorage.app",
      messagingSenderId: "880486827871",
      appId: "1:880486827871:web:8326701d76b4e6d3a958ea"
    };

    const app  = initializeApp(firebaseConfig);
    const db   = getFirestore(app);
    const auth = getAuth(app);
    const ADMIN_EMAIL = 'nadelacruz01@gmail.com';

    function escapeHtml(str = '') {
      return String(str).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
    /* headcount = the registrant (1) + every comma-separated companion */
    function computeHeadcount(companionsStr) {
      const extra = (companionsStr || '').split(',').map((s) => s.trim()).filter(Boolean).length;
      return 1 + extra;
    }

    const tableWrap      = document.getElementById('tableWrap');
    const refreshBtn      = document.getElementById('refresh');
    const clearBtn        = document.getElementById('clearAll');
    const authArea        = document.getElementById('authArea');
    const exportPdfBtn    = document.getElementById('exportPdf');
    const exportExcelBtn  = document.getElementById('exportExcel');
    const backToSiteBtn   = document.getElementById('backToSite');
    const searchInput     = document.getElementById('searchInput');
    const filterGroup     = document.getElementById('filterGroup');

    const loginModal       = document.getElementById('loginModal');
    const loginSubmit      = document.getElementById('loginSubmit');
    const loginCancel      = document.getElementById('loginCancel');
    const adminEmailModal  = document.getElementById('adminEmailModal');
    const adminPassModal   = document.getElementById('adminPassModal');
    const loginError       = document.getElementById('loginError');
    const toggleLoginPass  = document.getElementById('toggleLoginPass');

    /* floating-label "has-value" sync, same behavior as the main site */
    [adminEmailModal, adminPassModal].forEach((input) => {
      input.addEventListener('input', () => input.classList.toggle('has-value', input.value.trim().length > 0));
    });

    toggleLoginPass.addEventListener('click', () => {
      const showing = adminPassModal.type === 'text';
      adminPassModal.type = showing ? 'password' : 'text';
      toggleLoginPass.textContent = showing ? '👁' : '🙈';
      adminPassModal.focus();
    });

    /* ---- state ---- */
    let allSubmissions = [];
    let usingLocalStorage = false;
    let currentFilter = 'all';
    let currentSearch = '';

    function updateStats(arr) {
      document.getElementById('statTotal').textContent   = arr.length;
      document.getElementById('statGoing').textContent   = arr.filter((r) => r.status === 'going').length;
      document.getElementById('statRegrets').textContent = arr.filter((r) => r.status === 'regrets').length;
    }
    function resetStats() {
      ['statTotal', 'statGoing', 'statRegrets'].forEach((id) => { document.getElementById(id).textContent = '—'; });
    }

    function setControlsDisabled(disabled) {
      [refreshBtn, clearBtn, exportPdfBtn, exportExcelBtn].forEach((b) => {
        if (!b) return;
        b.classList.toggle('disabled', disabled);
        if (disabled) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
      });
      if (disabled) {
        tableWrap.innerHTML = '<div class="state-loading"><span class="state-icon">🔐</span>Sign in to view submissions.</div>';
        resetStats();
      }
    }

    function showLoginModal(show = true) {
      if (show) {
        loginModal.style.display = 'flex';
        loginModal.setAttribute('aria-hidden', 'false');
        adminEmailModal.focus();
        setControlsDisabled(true);
        document.documentElement.style.overflow = 'hidden';
      } else {
        loginModal.style.display = 'none';
        loginModal.setAttribute('aria-hidden', 'true');
        setControlsDisabled(false);
        document.documentElement.style.overflow = '';
      }
    }

    function renderSignInFormInline() {
      authArea.innerHTML = `
        <div class="signin-inline">
          <input id="adminEmail" class="input no-float" placeholder="admin email" value="${ADMIN_EMAIL}" autocomplete="email" />
          <input id="adminPass" class="input no-float" placeholder="password" type="password" autocomplete="current-password" />
          <button id="signInBtn" class="btn btn--ghost btn--sm">🔓 Sign in</button>
        </div>
      `;
      document.getElementById('signInBtn').addEventListener('click', async () => {
        const email = document.getElementById('adminEmail').value.trim();
        const pass  = document.getElementById('adminPass').value;
        await attemptSignIn(email, pass);
      });
    }

    function renderSignedIn(email) {
      authArea.innerHTML = `
        <div class="auth-chip"><span class="dot"></span> <strong>${escapeHtml(email)}</strong>
          <button id="logout" class="btn btn--ghost btn--sm" style="margin-left:6px;">Logout</button>
        </div>
      `;
      document.getElementById('logout').addEventListener('click', async () => {
        try { await signOut(auth); } catch (e) { console.error(e); }
        sessionStorage.removeItem('admin_logged_in');
        window.location.href = 'index.html';
      });
    }

    async function attemptSignIn(email, pass) {
      loginError.style.display = 'none';
      loginError.textContent = '';
      try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        if (cred.user && cred.user.email === ADMIN_EMAIL) {
          sessionStorage.setItem('admin_logged_in', '1');
          showLoginModal(false);
          renderSignedIn(cred.user.email);
          await loadAndRenderSubmissions();
        } else {
          await signOut(auth);
          loginError.textContent = 'Not authorized for admin access.';
          loginError.style.display = 'block';
        }
      } catch (err) {
        console.error('sign in failed', err);
        loginError.textContent = 'Sign in failed. Check credentials or network.';
        loginError.style.display = 'block';
      }
    }

    async function loadSubmissionsFromFirestore() {
      const user = auth.currentUser;
      if (!user || user.email !== ADMIN_EMAIL) { showLoginModal(true); return null; }
      try {
        const q = query(collection(db, 'submissions'), orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        const items = [];
        snap.forEach((docSnap) => {
          const data = docSnap.data();
          items.push({
            id: docSnap.id,
            status: data.status || '',
            fullname: data.fullname || data.regName || '',
            phone: data.phone || '',
            email: data.email || '',
            companions: data.companions || '',
            message: data.message || '',
            timestamp: data.timestamp || data.createdAt?.toDate?.()?.toISOString?.() || '',
          });
        });
        return items;
      } catch (err) {
        console.error('Failed to load from Firestore', err);
        return null;
      }
    }

    function applyFilters(arr) {
      return arr.filter((r) => {
        if (currentFilter !== 'all' && r.status !== currentFilter) return false;
        if (currentSearch && !(r.fullname || '').toLowerCase().includes(currentSearch)) return false;
        return true;
      });
    }

    function renderTable(fullArr, isLocal = false) {
      updateStats(fullArr);
      const arr = applyFilters(fullArr);

      if (!fullArr.length) {
        tableWrap.innerHTML = '<div class="state-empty"><span class="state-icon">🎟</span>No submissions yet. Check back soon!</div>';
        return;
      }
      if (!arr.length) {
        tableWrap.innerHTML = '<div class="state-empty"><span class="state-icon">🔎</span>No guests match this filter or search.</div>';
        return;
      }

      let html = `<table id="rsvpTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Status</th>
            <th>Full Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Companions</th>
            <th>Message</th>
            <th>Total Headcount</th>
            <th>Timestamp</th>
            <th>Action</th>
          </tr>
        </thead><tbody>`;

      arr.forEach((r) => {
        const originalIndex = fullArr.indexOf(r);
        const isGoing = r.status === 'going';
        const badge = isGoing
          ? '<span class="badge going">✅ Going</span>'
          : '<span class="badge regrets">😢 Regrets</span>';
        const ts = r.timestamp ? new Date(r.timestamp).toLocaleString() : '—';
        const deleteBtnAttr = isLocal ? `data-local-index="${originalIndex}"` : `data-id="${r.id || ''}"`;
        const headcount = isGoing ? computeHeadcount(r.companions) : '—';

        html += `<tr ${r.id ? `data-id="${escapeHtml(r.id)}"` : ''}>
          <td><span class="row-num">${originalIndex + 1}</span></td>
          <td>${badge}</td>
          <td><span class="cell-name">${escapeHtml(r.fullname) || '—'}</span></td>
          <td>${escapeHtml(r.phone) || '—'}</td>
          <td>${escapeHtml(r.email) || '—'}</td>
          <td>${escapeHtml(r.companions) || '—'}</td>
          <td>${escapeHtml(r.message) || '—'}</td>
          <td><span class="cell-headcount">${headcount}</span></td>
          <td>${escapeHtml(ts)}</td>
          <td><button class="delete-btn" ${deleteBtnAttr}>🗑 Delete</button></td>
        </tr>`;
      });

      html += '</tbody></table>';
      tableWrap.innerHTML = html;
    }

    function rerenderCurrent() { renderTable(allSubmissions, usingLocalStorage); }

    searchInput.addEventListener('input', () => {
      currentSearch = searchInput.value.trim().toLowerCase();
      rerenderCurrent();
    });
    filterGroup.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-filter]');
      if (!btn) return;
      currentFilter = btn.getAttribute('data-filter');
      filterGroup.querySelectorAll('.filter-chip').forEach((c) => c.classList.toggle('is-active', c === btn));
      rerenderCurrent();
    });

    async function loadAndRenderSubmissions() {
      const user = auth.currentUser;
      if (!user || user.email !== ADMIN_EMAIL) { showLoginModal(true); return; }

      tableWrap.innerHTML = '<div class="state-loading"><span class="state-icon">⏳</span>Loading submissions…</div>';

      const items = await loadSubmissionsFromFirestore();
      if (items === null) {
        const raw = localStorage.getItem('rsvp_submissions');
        const arr = raw ? JSON.parse(raw) : [];
        allSubmissions = arr.slice().reverse();
        usingLocalStorage = true;
        renderTable(allSubmissions, true);
        return;
      }
      allSubmissions = items;
      usingLocalStorage = false;
      renderTable(allSubmissions, false);
    }

    async function deleteFirestoreEntry(id) {
      const user = auth.currentUser;
      if (!user || user.email !== ADMIN_EMAIL) { showLoginModal(true); return; }
      if (!confirm('Delete this entry from Firestore? This cannot be undone.')) return;
      try {
        await deleteDoc(doc(db, 'submissions', id));
        await loadAndRenderSubmissions();
      } catch (err) {
        console.error('delete failed', err);
        alert('Failed to delete entry. Check permissions and network.');
      }
    }

    function deleteLocalEntryByIndex(localIndex) {
      if (!confirm('Delete this local entry? This cannot be undone.')) return;
      try {
        const raw = localStorage.getItem('rsvp_submissions');
        const arr = raw ? JSON.parse(raw) : [];
        const removeIndex = arr.length - 1 - localIndex;
        if (removeIndex >= 0 && removeIndex < arr.length) {
          arr.splice(removeIndex, 1);
          localStorage.setItem('rsvp_submissions', JSON.stringify(arr));
          loadAndRenderSubmissions();
        } else {
          alert('Could not find local entry to delete.');
        }
      } catch (err) {
        console.error('local delete failed', err);
        alert('Failed to delete local entry.');
      }
    }

    tableWrap.addEventListener('click', (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      const localIndex = btn.hasAttribute('data-local-index') ? parseInt(btn.getAttribute('data-local-index'), 10) : null;
      if (id) deleteFirestoreEntry(id);
      else if (localIndex !== null && !isNaN(localIndex)) deleteLocalEntryByIndex(localIndex);
    });

    async function clearAllFirestoreEntries() {
      const user = auth.currentUser;
      if (!user || user.email !== ADMIN_EMAIL) { showLoginModal(true); return; }
      if (!confirm('Clear ALL saved entries from Firestore? This cannot be undone.')) return;
      try {
        const q = query(collection(db, 'submissions'));
        const snap = await getDocs(q);
        const deletes = [];
        snap.forEach((d) => deletes.push(deleteDoc(doc(db, 'submissions', d.id))));
        await Promise.all(deletes);
        await loadAndRenderSubmissions();
      } catch (err) {
        console.error('clear failed', err);
        alert('Failed to clear entries. Check permissions and network.');
      }
    }

    /* Exports always reflect the FULL list, not just the current filter/search view */
    function exportTableToCSV(filename = 'rsvps.csv') {
      const user = auth.currentUser;
      if (!user || user.email !== ADMIN_EMAIL) { showLoginModal(true); return; }
      if (!allSubmissions.length) { alert('No data to export'); return; }
      const header = ['#', 'Status', 'Full Name', 'Phone', 'Email', 'Companions', 'Message', 'Total Headcount', 'Timestamp'];
      const rows = allSubmissions.map((r, i) => [
        i + 1,
        r.status === 'going' ? 'Going' : 'Regrets',
        r.fullname, r.phone, r.email, r.companions, r.message,
        r.status === 'going' ? computeHeadcount(r.companions) : '',
        r.timestamp ? new Date(r.timestamp).toLocaleString() : '',
      ]);
      const csv = [header, ...rows].map((row) => row.map((cell) => `"${String(cell ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    }

    function exportTableToPDF() {
      const user = auth.currentUser;
      if (!user || user.email !== ADMIN_EMAIL) { showLoginModal(true); return; }
      const table = document.getElementById('rsvpTable');
      if (!table) { alert('No table to export'); return; }
      const w = window.open('', '_blank', 'noopener');
      if (!w) { alert('Unable to open print window.'); return; }
      const style = '<style>body{font-family:Arial,sans-serif;color:#000;padding:12px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:6px;text-align:left;font-size:12px}th{background:#f2f2f2}</style>';
      w.document.write('<html><head><title>RSVPs – Zavier 7th Birthday</title>' + style + '</head><body>');
      w.document.write("<h2>Zavier's 7th Birthday — RSVPs</h2>");
      w.document.write(table.outerHTML);
      w.document.write('</body></html>');
      w.document.close();
      setTimeout(() => { w.print(); }, 300);
    }

    (function init() {
      setControlsDisabled(true);
      renderSignInFormInline();
      showLoginModal(true);

      refreshBtn.addEventListener('click', async () => {
        const user = auth.currentUser;
        if (!user || user.email !== ADMIN_EMAIL) { showLoginModal(true); return; }
        await loadAndRenderSubmissions();
      });

      clearBtn.addEventListener('click', clearAllFirestoreEntries);
      exportExcelBtn.addEventListener('click', () => exportTableToCSV('rsvps.csv'));
      exportPdfBtn.addEventListener('click', exportTableToPDF);

      backToSiteBtn.addEventListener('click', async () => {
        try { await signOut(auth); } catch (e) { console.error(e); }
        sessionStorage.removeItem('admin_logged_in');
        window.location.href = 'index.html';
      });

      loginSubmit.addEventListener('click', async () => {
        await attemptSignIn(adminEmailModal.value.trim(), adminPassModal.value);
      });
      adminPassModal.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') await attemptSignIn(adminEmailModal.value.trim(), adminPassModal.value);
      });
      loginCancel.addEventListener('click', () => {
        sessionStorage.removeItem('admin_logged_in');
        window.location.href = 'index.html';
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && loginModal.getAttribute('aria-hidden') === 'false') {
          sessionStorage.removeItem('admin_logged_in');
          window.location.href = 'index.html';
        }
      });

      if (sessionStorage.getItem('admin_logged_in') === '1') {
        onAuthStateChanged(auth, (user) => {
          if (user && user.email === ADMIN_EMAIL) {
            showLoginModal(false);
            renderSignedIn(user.email);
            loadAndRenderSubmissions();
          } else {
            sessionStorage.removeItem('admin_logged_in');
            renderSignInFormInline();
            showLoginModal(true);
          }
        });
      }
    })();

    onAuthStateChanged(auth, (user) => {
      if (user && user.email === ADMIN_EMAIL) {
        sessionStorage.setItem('admin_logged_in', '1');
        showLoginModal(false);
        renderSignedIn(user.email);
        loadAndRenderSubmissions();
      } else {
        sessionStorage.removeItem('admin_logged_in');
        renderSignInFormInline();
        showLoginModal(true);
      }
    });
  </script>
